apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: example-{{ .Values.name }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: [{{ .Values.crd | quote }}]
    verbs: ["get"]
  - apiGroups: [{{ .Values.group | quote }}]
    resources: [{{ .Values.resource | quote }}]
    verbs: ["get", "list", "watch"]
  - apiGroups: [{{ .Values.group | quote }}]
    resources: [{{ printf "%s/status" .Values.resource | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: example-{{ .Values.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: example-{{ .Values.name }}
subjects:
  - kind: ServiceAccount
    name: example-{{ .Values.name }}
    namespace: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: example-{{ .Values.name }}
  template:
    metadata:
      labels:
        app: example-{{ .Values.name }}
    spec:
      serviceAccountName: example-{{ .Values.name }}
      containers:
        - name: controller
          image: {{ .Values.image | quote }}
          imagePullPolicy: Always
          command: ["/manager"]
          args: ["run", "module", {{ .Values.name | quote }}]
          env:
            - name: PLATFORM_MODULES_DIR
              value: /config/modules
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
